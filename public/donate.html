<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support this server</title>
<style>
body{margin:0;min-height:100vh;display:flow-root;background:radial-gradient(circle at 50% 0,#23262c,#121416 70%);color:#e8eaed;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px}
.off{max-width:460px;margin:64px auto;text-align:center;color:#9aa0a6}
</style>
</head>
<body>
<div id="donate-page"></div>
<noscript><p class="off">This page needs JavaScript.</p></noscript>
<script src="/donate.js"></script>
<script>
// (when the owner has the message off, the script shows nothing: say so)
setTimeout(function () { fetch('/api/donation', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) { if (!d.enabled) document.getElementById('donate-page').innerHTML = '<p class="off">Donations are not open right now.</p>'; }).catch(function () {}); }, 300);
</script>
</body>
</html>
